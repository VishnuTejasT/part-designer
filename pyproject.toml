[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmid-design"
version = "0.1.0"
description = "Protein-to-optimized-plasmid design assistant for iGEM teams"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["flask>=3.0,<4.0", "ViennaRNA>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plasmid-design = "plasmid_design.cli:main"
plasmid-design-optimize = "plasmid_design.optimize_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasmid_design = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
